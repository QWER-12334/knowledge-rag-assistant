<!DOCTYPE html>
<html lang="zh-CN">   
<head>
    <meta charset="UTF-8">
    <title>电商知识问答</title>
    <style>
      .answer-box {
        border: 4px solid #64bf6c;   
        padding: 12px;            
        min-width: 400px;             
        min-height: 100px; 
        border-radius: 12px;
        overflow-y: auto;
        margin-top: 12px;  
        font-size: 14px;       
      }
      .input-box{
        width:400px;
        min-height: 100px;
        border: 3px solid #30727f;
        border-radius: 10px;
        overflow-y: auto;
        padding: 12px;
        resize: vertical; 
      }
      .button-box{
        width:400px;
        height:40px;
        background-color:rgb(151, 129, 163);
        margin-top: 12px;
        border:1px solid #30727f;
        display:block;
      }
    </style>
  </head>
  <body>
    <h1>电商知识问答助手</h1>
    <textarea  id ="question" class="input-box" placeholder="请输入问题"></textarea><!-- 问题输入框 -->
    <button class="button-box" onclick="handleSend()">发送</button><!-- 发送按钮 -->
    <div class="answer-box" id="answer">AI 的回答会显示在这里……</div> <!-- 回答框 -->
    <script>
      async function handleSend() {
        var text = document.getElementById("question").value; 
        var answerBox = document.getElementById("answer");
        if (!text){
          answerBox.innerText = "请输入问题后再发送";
          return;
        }
        answerBox.innerText = "正在生成回答，请稍等……";
        try{
          const res = await fetch("/ask",{
            method: "POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({query:text})
          });
          if (!res.ok){
            throw new Error("HTTP " + res.status);
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder("utf-8");
          answerBox.innerText = "";
          while(true){
            const {done,value}= await reader.read();
            if (done) break;
            answerBox.innerText += decoder.decode(value,{stream:true});
          }
        }
        catch(error){
          answerBox.innerText = "请求出错："+error.message;
        }
      }
        </script>
  </body>
  </html>
